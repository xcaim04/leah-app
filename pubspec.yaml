name: mi_armario
description: Armario digital local con sugerencias de combinaciones.
publish_to: "none"
version: 0.6.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  image_picker: ^1.1.2
  palette_generator: ^0.3.3+6
  geolocator: ^14.1.2
  sqflite_common_ffi_web: ^1.0.1
  image: ^4.5.4
  http: ^1.5.0
  share_plus: ^13.3.1
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Bundled (not google_fonts): the app works offline.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  # Adaptive (API 26+): full-bleed gradient + white line art split from icon.png,
  # so the launcher mask shapes it instead of the baked-in rounded square.
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
