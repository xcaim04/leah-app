<script>
  // Micro-interacción: Cambio visual en botones Chips
  document.querySelectorAll('#category-chips .chip, #occasion-chips .chip').forEach(button => {
    button.addEventListener('click', function() {
      const container = this.parentElement;
      container.querySelectorAll('.chip').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
        btn.classList.add('bg-surface-container', 'text-on-surface');
        const checkIcon = btn.querySelector('.material-symbols-outlined');
        if (checkIcon) checkIcon.remove();
      });
      this.classList.remove('bg-surface-container', 'text-on-surface');
      this.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
      
      const newIcon = document.createElement('span');
      newIcon.className = 'material-symbols-outlined text-[16px]';
      newIcon.textContent = 'check';
      this.insertBefore(newIcon, this.firstChild);
    });
  });

  // Micro-interacción para el selector de colores detectados
  document.querySelectorAll('.color-swatch').forEach(swatch => {
    swatch.addEventListener('click', function() {
      const icon = this.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.remove();
        this.classList.add('opacity-40');
      } else {
        this.classList.remove('opacity-40');
        const newCheck = document.createElement('span');
        newCheck.className = 'material-symbols-outlined text-white text-[20px] drop-shadow-sm';
        newCheck.textContent = 'check';
        this.appendChild(newCheck);
      }
    });
  });
