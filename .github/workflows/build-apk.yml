# Builds the release APK only when the `release` branch is updated.
# To ship: git push github main:release
name: Build APK

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Signs with the release key from repo secrets so each APK installs over the previous one.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Fail instead of silently shipping a debug-signed APK that can't update the installed app.
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Missing signing secrets"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Universal APK (ARM 32/64 + x86_64) so one file installs on any phone.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: mi-armario-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*-release.apk
